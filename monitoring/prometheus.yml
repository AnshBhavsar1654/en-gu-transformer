global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/scheduled-rules.yml

scrape_configs:
  - job_name: en-gu-api
    static_configs:
      - targets: ['api:8000']
  - job_name: en-gu-monitoring
    static_configs:
      - targets: ['monitor-exporter:9100']
