[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "en-gu"
version = "0.1.0"
description = "English to Gujarati neural machine translation: Transformer trained from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "sentencepiece>=0.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20", "huggingface_hub>=0.20.0", "langdetect==1.0.9", "psutil>=6"]
ui = ["streamlit>=1.40.0", "httpx>=0.27", "huggingface_hub>=0.20.0"]
serve = ["en-gu[api,ui]"]
train = ["sacrebleu>=2.4.0", "tqdm>=4.66.0", "matplotlib>=3.7.0"]
tracking = ["mlflow>=2.16"]
load = ["locust>=2.32,<3"]
monitor = [
    "evidently==0.7.23",
    "pandas<3.1",  # Evidently imports a pandas helper removed in 3.1 (evidentlyai/evidently#1974).
    "sacrebleu>=2.4.0",
    "prometheus-client>=0.20",
    "langdetect==1.0.9",
]
dev = ["en-gu[api]", "mlflow>=2.16", "pytest>=8.0", "ruff>=0.6.0", "pre-commit>=3.7", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: end-to-end pipeline tests (a few seconds on CPU)",
    "smoke: model smoke tests that start the real API process on a tiny random model",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip() without strict= is fine here
