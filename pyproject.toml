[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "en-gu"
version = "0.1.0"
description = "English to Gujarati neural machine translation: Transformer trained from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "sentencepiece>=0.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["streamlit>=1.40.0", "huggingface_hub>=0.20.0"]
train = ["sacrebleu>=2.4.0", "tqdm>=4.66.0", "matplotlib>=3.7.0"]
dev = ["pytest>=8.0", "ruff>=0.6.0", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end pipeline tests (a few seconds on CPU)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip() without strict= is fine here
